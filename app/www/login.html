<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飞牛监控pro · 登录</title>
<style>
  :root{ --bg:#0f1419; --card:#1a212b; --accent:#3b82f6; --text:#e6edf3; --muted:#8b98a5; --border:#2a3340; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; }
  body{ background:radial-gradient(1200px 600px at 50% -10%, #16324f 0%, var(--bg) 60%);
        color:var(--text); min-height:100%;
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
        display:flex; align-items:center; justify-content:center; padding:20px; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px;
         padding:36px 32px; width:360px; max-width:92vw; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  .brand{ display:flex; align-items:center; gap:12px; margin-bottom:4px; }
  .logo{ width:42px; height:42px; border-radius:10px;
         background:linear-gradient(135deg,#3b82f6,#22d3ee);
         display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:#fff; }
  h1{ font-size:18px; margin:0; }
  .sub{ color:var(--muted); font-size:13px; margin:2px 0 22px; }
  .btn{ display:block; width:100%; padding:12px 14px; border:0; border-radius:10px;
        font-size:15px; font-weight:600; cursor:pointer; transition:.15s; }
  .btn-primary{ background:linear-gradient(135deg,#3b82f6,#2563eb); color:#fff; }
  .btn-primary:hover{ filter:brightness(1.08); }
  .btn-primary:disabled{ opacity:.7; cursor:default; }
  input{ width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--border);
         background:#0f1620; color:var(--text); font-size:14px; margin-top:8px; }
  .msg{ margin-top:14px; font-size:13px; min-height:18px; color:#f87171; }
  .msg.ok{ color:#34d399; }
  .hint{ margin-top:16px; font-size:12px; color:var(--muted); line-height:1.6; }
  .row{ display:none; }
  .spinner{ display:inline-block; width:14px; height:14px; border:2px solid rgba(255,255,255,.4);
            border-top-color:#fff; border-radius:50%; animation:spin .7s linear infinite;
            vertical-align:-2px; margin-right:6px; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card">
    <div class="brand"><div class="logo">FN</div><div><h1>飞牛监控pro</h1></div></div>
    <div class="sub" id="subtitle">请登录以继续使用</div>

    <div class="row" id="pwBox">
      <input type="password" id="pwInput" placeholder="应用访问口令" autocomplete="off">
      <button class="btn btn-primary" id="pwBtn" style="margin-top:10px;">使用口令登录</button>
    </div>

    <div class="row" id="setupBox">
      <input type="password" id="setInput" placeholder="设置访问口令（至少 4 位）" autocomplete="off">
      <button class="btn btn-primary" id="setBtn" style="margin-top:10px;">设置并进入</button>
    </div>

    <div class="msg" id="msg"></div>
    <div class="hint" id="hint"></div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
function msg(t, ok){ const e = $("msg"); e.textContent = t || ""; e.className = "msg" + (ok ? " ok" : ""); }

async function go(){
  // 已登录则直接进入
  try {
    const r = await fetch('/api/auth/session', { cache:"no-store" });
    const d = await r.json();
    if (d.authenticated){ location.href = '/'; return; }
  } catch(e){}
  // 读取鉴权配置决定界面
  let cfg = { auth_enabled:true };
  try { const r = await fetch('/api/auth/config', { cache:"no-store" }); cfg = await r.json(); } catch(e){}
  if (!cfg.auth_enabled){ location.href = '/'; return; }
  if (cfg.setup_mode){
    // 首次使用（未设置访问口令）：引导设置本地访问口令
    $("setupBox").style.display = "block";
    $("subtitle").textContent = "请设置访问口令";
    $("hint").textContent = "首次使用请设置一个访问口令，之后凭口令登录（可在「设置 → 登录与授权」修改或关闭登录）。";
  } else {
    // 已配置过访问口令：提供口令登录入口
    if (!cfg.requires_password){ $("setupBox").style.display = "block"; }
    else { $("pwBox").style.display = "block"; }
    $("hint").textContent = "请输入应用访问口令登录。";
  }
}

$("pwBtn").onclick = async () => {
  const r = await fetch('/api/auth/password', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ password: $("pwInput").value })
  });
  const d = await r.json();
  if (d.ok){ location.href = '/'; } else { msg(d.error || "登录失败"); }
};

$("setBtn").onclick = async () => {
  const r = await fetch('/api/auth/setup', {
    method:'POST', headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ password: $("setInput").value })
  });
  const d = await r.json();
  if (d.ok){ location.href = '/'; } else { msg(d.error || "设置失败"); }
};

go();
</script>
</body>
</html>
